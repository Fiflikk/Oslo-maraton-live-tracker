<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Oslo Maraton – Live Tracker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d10;color:#fff}#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:16px;right:16px;top:16px;max-width:520px;margin:auto;background:rgba(12,15,19,.92);backdrop-filter:blur(12px);border:1px solid #30353d;border-radius:18px;padding:16px;box-shadow:0 12px 40px #0008}.title{font-size:20px;font-weight:800}.sub{color:#aeb5bf;font-size:13px;margin-top:2px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.primary{background:#fff;color:#000}.danger{background:#3a1518;color:#ffb3b8}.ghost{background:#20252c;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#181c22;border-radius:12px;padding:10px}.label{font-size:11px;color:#929aa6}.value{font-size:17px;font-weight:800;margin-top:3px}.status{margin-top:10px;font-size:12px;color:#b8c0ca}.gpsbanner{margin-top:10px;padding:9px 11px;border-radius:10px;background:#20252c;color:#cbd2dc;font-size:12px;font-weight:700}.gpsbanner.live{background:#14351f;color:#9ff0b2}.gpsbanner.warn{background:#3b2d12;color:#ffd98a}.runner{font-size:22px}.leaflet-control-attribution{font-size:9px!important}</style></head><body><div id="map"></div><div class="panel"><div class="title">🏃 Oslo Maraton – Live Tracker</div><div class="sub">Egen GPS-sporing + maratonløype</div><div id="gpsBanner" class="gpsbanner">📍 Ikke startet</div><div class="stats"><div class="stat"><div class="label">Status</div><div class="value" id="status">Klar</div></div><div class="stat"><div class="label">Fart</div><div class="value" id="speed">–</div></div><div class="stat"><div class="label">GPS</div><div class="value" id="accuracy">–</div></div></div><div class="row"><button class="btn primary" id="start">▶ Start GPS</button><button class="btn danger" id="stop">■ Stopp</button><button class="btn ghost" id="follow">◎ Følg meg</button></div><div class="status" id="detail">Åpne denne siden på iPhone og trykk Start GPS. Posisjonen sendes til live-trackeren.</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([59.91,10.73],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let route,marker,accuracyCircle,watchId=null,follow=true;
fetch('route.json').then(r=>r.json()).then(points=>{route=L.polyline(points.map(p=>[p.lat,p.lon]),{weight:5,opacity:.85}).addTo(map);map.fitBounds(route.getBounds(),{padding:[30,30]});});
function fmtSpeed(mps){return Number.isFinite(mps)?(mps*3.6).toFixed(1)+' km/t':'–'}
function setBanner(text,cls=''){const b=document.getElementById('gpsBanner');b.textContent=text;b.className='gpsbanner '+cls}
function update(p){const c=p.coords||p;const lat=c.latitude??c.lat,lon=c.longitude??c.lon,acc=c.accuracy??null,speed=c.speed??p.speed??null,heading=c.heading??p.heading??null;if(!Number.isFinite(lat)||!Number.isFinite(lon))return;if(!marker){marker=L.marker([lat,lon],{icon:L.divIcon({className:'runner',html:'🏃',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map)}else marker.setLatLng([lat,lon]);if(acc){if(!accuracyCircle)accuracyCircle=L.circle([lat,lon],{radius:acc,weight:1,fillOpacity:.08}).addTo(map);else accuracyCircle.setLatLng([lat,lon]).setRadius(acc)}if(follow)map.panTo([lat,lon]);document.getElementById('speed').textContent=fmtSpeed(speed);document.getElementById('accuracy').textContent=acc?Math.round(acc)+' m':'–';document.getElementById('status').textContent='LIVE';if(p.fromServer){setBanner('🟢 Live-posisjon mottatt','live')}document.getElementById('detail').textContent=new Date(p.timestamp||Date.now()).toLocaleTimeString('no-NO')+(heading!=null?' · retning '+Math.round(heading)+'°':'');}
async function send(pos){const c=pos.coords;const payload={lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,speed:c.speed,heading:c.heading,timestamp:pos.timestamp};update(pos);setBanner('🟢 GPS aktiv – sender posisjon','live');try{await fetch('/api/location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){document.getElementById('status').textContent='Kun lokal';document.getElementById('detail').textContent='GPS fungerer, men serveren mottok ikke posisjonen.'}}
start.onclick=()=>{if(!navigator.geolocation)return alert('Nettleseren støtter ikke GPS.');if(location.protocol!=='https:'&&location.hostname!=='localhost'){setBanner('⚠️ HTTPS kreves for GPS på iPhone','warn');return alert('Åpne siden via HTTPS på iPhone for å bruke GPS.');}if(watchId!==null)navigator.geolocation.clearWatch(watchId);setBanner('📍 Søker etter GPS-posisjon…');watchId=navigator.geolocation.watchPosition(send,err=>{document.getElementById('status').textContent='GPS-feil';document.getElementById('detail').textContent=err.message;setBanner('⚠️ GPS-feil: '+err.message,'warn')},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});document.getElementById('status').textContent='Starter…'};
stop.onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;document.getElementById('status').textContent='Stoppet'};follow.onclick=()=>{follow=!follow;document.getElementById('follow').textContent=follow?'◎ Følg meg':'○ Følg meg'};
const es=new EventSource('/api/stream');es.onmessage=e=>{const p=JSON.parse(e.data);update({coords:{latitude:p.lat,longitude:p.lon,accuracy:p.accuracy,speed:p.speed,heading:p.heading},timestamp:p.timestamp,fromServer:true});};
</script></body></html>
